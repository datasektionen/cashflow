name: Cashflow 4

on:
  push:
    branches: [master, slop-rewrite]
    paths: [server/**, web/**, proto/**, backend/**/migrations/**, Dockerfile.next*, .github/workflows/next.yml]
  pull_request:
    paths: [server/**, web/**, proto/**, backend/**/migrations/**, Dockerfile.next*, .github/workflows/next.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      - run: bun run build
      # The build regenerates the route tree, which is committed.
      - run: git diff --exit-code src/routeTree.gen.ts

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

  # Generated code is committed; fail if it is stale.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: make gen
      - run: git diff --exit-code

  # Go's copy of the Django schema must match Cashflow 3's migrations.
  django-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
          POSTGRES_DB: cashflow
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: make django-schema
      - run: git diff --exit-code server/internal/database/cashflow3/schema.sql

  image:
    runs-on: ubuntu-latest
    needs: [web, server, generated, django-schema]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.next
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
