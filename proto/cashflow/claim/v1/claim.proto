syntax = "proto3";

package cashflow.claim.v1;

import "google/protobuf/timestamp.proto";

// ClaimService reads expenses and invoices ("claims"). Every method only
// returns claims the caller may view.
service ClaimService {
  // ListClaims lists claims, optionally narrowed to one work queue.
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetClaim returns one claim in full. NotFound also covers claims the
  // caller may not view, so their existence does not leak.
  rpc GetClaim(GetClaimRequest) returns (GetClaimResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetQueueCounts returns how many claims wait in each queue the caller
  // works in, for the sidebar.
  rpc GetQueueCounts(GetQueueCountsRequest) returns (GetQueueCountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetOverview summarises the caller's own claims.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Workflow actions. Each returns the claim as it is afterwards, and fails
  // with a cashflow.common.v1.Problem when a rule forbids it; Claim.actions
  // says beforehand which are allowed.

  // AddComment comments on a claim; the owner is emailed unless they wrote it.
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);

  // SetPartAttested attests or unattests one part.
  rpc SetPartAttested(SetPartAttestedRequest) returns (SetPartAttestedResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetConfirmed confirms or unconfirms an expense's receipts.
  rpc SetConfirmed(SetConfirmedRequest) returns (SetConfirmedResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetFlagged flags an expense for its owner to fix, or clears the flag.
  rpc SetFlagged(SetFlaggedRequest) returns (SetFlaggedResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PayInvoice records an invoice as paid. Expenses are paid out in payouts.
  rpc PayInvoice(PayInvoiceRequest) returns (PayInvoiceResponse);

  // DeleteClaim deletes an unpaid claim.
  rpc DeleteClaim(DeleteClaimRequest) returns (DeleteClaimResponse);

  // CreateClaim submits a new expense or invoice owned by the caller. Files
  // are uploaded first (POST /files) and referenced by upload id. Invalid
  // input fails with cashflow.common.v1.FieldViolations.
  rpc CreateClaim(CreateClaimRequest) returns (CreateClaimResponse);

  // UpdateClaim edits the caller's own unpaid claim. Changing parts or files
  // voids the receipt's confirmation; editing an expense clears its flag.
  rpc UpdateClaim(UpdateClaimRequest) returns (UpdateClaimResponse);
}

enum ClaimKind {
  CLAIM_KIND_UNSPECIFIED = 0;
  CLAIM_KIND_EXPENSE = 1;
  CLAIM_KIND_INVOICE = 2;
}

// The work queues of Cashflow 3's admin section.
enum Queue {
  QUEUE_UNSPECIFIED = 0;
  // Claims with a part the caller may attest. Never the caller's own expenses.
  QUEUE_ATTEST = 1;
  // Expenses whose receipts are not yet confirmed.
  QUEUE_CONFIRM = 2;
  // Paid claims without a Fortnox voucher.
  QUEUE_ACCOUNT = 3;
  // Fully attested claims (and confirmed, for expenses) not yet paid.
  QUEUE_PAY = 4;
}

// Where a claim is in its workflow. Expenses go submitted → attested →
// confirmed → paid → accounted; invoices skip confirmation.
enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_SUBMITTED = 1;
  STAGE_ATTESTED = 2;
  STAGE_CONFIRMED = 3;
  STAGE_PAID = 4;
  STAGE_ACCOUNTED = 5;
}

enum SortField {
  SORT_FIELD_UNSPECIFIED = 0;
  SORT_FIELD_DATE = 1;
  SORT_FIELD_AMOUNT = 2;
  SORT_FIELD_DESCRIPTION = 3;
  SORT_FIELD_OWNER = 4;
  SORT_FIELD_CREATED = 5;
}

message Person {
  string username = 1;
  string name = 2;
}

// Status flags. Stage is derived from them, but a flagged claim keeps its
// stage, so both are sent.
message Status {
  Stage stage = 1;
  bool attested = 2;
  bool confirmed = 3;
  bool paid = 4;
  // Fortnox voucher, e.g. "E1234"; empty until accounted.
  string verification = 5;
  bool flagged = 6;
}

message ClaimSummary {
  ClaimKind kind = 1;
  // The public id, unique per kind; used in URLs and Fortnox descriptions.
  int64 number = 2;
  string description = 3;
  Person owner = 4;
  int64 amount_ore = 5;
  // Expense date, else invoice date, else payment date; YYYY-MM-DD.
  string date = 6;
  // ISO date the claim was submitted.
  string created_date = 7;
  repeated string cost_centres = 8;
  Status status = 9;
}

message ListClaimsRequest {
  // Only the caller's own claims; otherwise every claim they may view.
  bool mine = 1;
  Queue queue = 2;
  ClaimKind kind = 3;
  // Matches the description, the owner's name or username, the voucher
  // number, or "#<number>".
  string query = 4;
  string cost_centre = 5;
  SortField sort = 6;
  bool descending = 7;
  // 1-based.
  int32 page = 8;
  // Defaults to 25, at most 100.
  int32 page_size = 9;
  // Only claims with a voucher; voucher_series narrows to one series ("E").
  bool accounted = 10;
  string voucher_series = 11;
}

message ListClaimsResponse {
  repeated ClaimSummary claims = 1;
  // Matching claims across all pages.
  int32 total = 2;
}

message GetClaimRequest {
  ClaimKind kind = 1;
  int64 number = 2;
}

// ClaimRef points at one claim.
message ClaimRef {
  ClaimKind kind = 1;
  int64 number = 2;
}

// What the caller may do with a claim right now.
message Actions {
  repeated int64 attest_part_ids = 1;
  repeated int64 unattest_part_ids = 2;
  bool confirm = 3;
  bool unconfirm = 4;
  bool flag = 5;
  bool unflag = 6;
  bool pay = 7;
  bool delete = 8;
  bool edit = 9;
  bool account = 10;
}

message Part {
  int64 id = 1;
  string cost_centre = 2;
  string secondary_cost_centre = 3;
  string budget_line = 4;
  int64 amount_ore = 5;
  Person attested_by = 6;
  // YYYY-MM-DD; empty until attested.
  string attested_at = 7;
}

message File {
  int64 id = 1;
  string name = 2;
  string content_type = 3;
  // Same-origin path that streams the file, e.g. "/files/12".
  string url = 4;
}

message Comment {
  Person author = 1;
  string body = 2;
  google.protobuf.Timestamp created_at = 3;
}

message Payment {
  int64 id = 1;
  // Bank-facing reference, e.g. "Data1234".
  string tag = 2;
  Person payer = 3;
  // YYYY-MM-DD.
  string date = 4;
}

message Claim {
  ClaimSummary summary = 1;
  repeated Part parts = 2;
  repeated File files = 3;
  repeated Comment comments = 4;

  // Expenses: who confirmed the receipts, and the payment that reimbursed it.
  Person confirmed_by = 5;
  string confirmed_at = 6;
  Payment payment = 7;

  // Invoices.
  string invoice_number = 8;
  string due_date = 9;
  Person paid_by = 10;
  string paid_at = 11;

  Actions actions = 12;
}

message GetClaimResponse {
  Claim claim = 1;
}

message GetQueueCountsRequest {}

message QueueCount {
  Queue queue = 1;
  int32 count = 2;
}

message GetQueueCountsResponse {
  // Only the queues the caller may see.
  repeated QueueCount counts = 1;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  // Submitted and waiting for attestation.
  int64 awaiting_attest_ore = 1;
  // Attested (and confirmed) but not yet paid.
  int64 awaiting_payment_ore = 2;
  // Paid out this calendar year.
  int64 paid_this_year_ore = 3;
}

message AddCommentRequest {
  ClaimRef claim = 1;
  string body = 2;
}

message AddCommentResponse {
  Claim claim = 1;
}

message SetPartAttestedRequest {
  ClaimRef claim = 1;
  int64 part_id = 2;
  bool attested = 3;
}

message SetPartAttestedResponse {
  Claim claim = 1;
}

message SetConfirmedRequest {
  // An expense number.
  int64 number = 1;
  bool confirmed = 2;
}

message SetConfirmedResponse {
  Claim claim = 1;
}

message SetFlaggedRequest {
  // An expense number.
  int64 number = 1;
  bool flagged = 2;
}

message SetFlaggedResponse {
  Claim claim = 1;
}

message PayInvoiceRequest {
  // An invoice number.
  int64 number = 1;
}

message PayInvoiceResponse {
  Claim claim = 1;
}

message DeleteClaimRequest {
  ClaimRef claim = 1;
}

message DeleteClaimResponse {}

// ClaimInput is a claim as the create and edit forms send it.
message ClaimInput {
  string description = 1;
  // YYYY-MM-DD: the expense date (required), or the invoice date (optional).
  string date = 2;
  // Invoices only.
  string invoice_number = 3;
  string due_date = 4;
  repeated PartInput parts = 5;
}

message PartInput {
  string cost_centre = 1;
  string secondary_cost_centre = 2;
  string budget_line = 3;
  int64 amount_ore = 4;
}

message CreateClaimRequest {
  ClaimKind kind = 1;
  ClaimInput claim = 2;
  // At least one, from POST /files.
  repeated string upload_ids = 3;
}

message CreateClaimResponse {
  Claim claim = 1;
}

message UpdateClaimRequest {
  ClaimRef ref = 1;
  ClaimInput claim = 2;
  // Files to add, from POST /files.
  repeated string upload_ids = 3;
  // Attached files to remove (File.id).
  repeated int64 remove_file_ids = 4;
}

message UpdateClaimResponse {
  Claim claim = 1;
}
